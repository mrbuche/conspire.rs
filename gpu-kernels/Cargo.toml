[package]
description = "conspire's own code, compiled for a CUDA device"
edition = "2024"
name = "conspire-gpu-kernels"
publish = false
version = "0.0.0"

[dependencies]
conspire = { path = "..", default-features = false, features = ["constitutive"] }

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
