name: Book
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}
env:
  CARGO_TERM_COLOR: always
on:
  pull_request:
    branches: main
  push:
    branches: main
  release:
    types: published
jobs:
  Book:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        id: last_release
        uses: InsonusK/get-latest-release@v1.1.0
        with:
          myToken: ${{ github.token }}
          view_top: 1
      - name: Rust
        uses: actions-rs/toolchain@v1
        with:
          default: true
          toolchain: stable
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: mdBook
        run: cargo install mdbook --version 0.5.4
      - name: Dependencies
        run: cargo install mdbook-katex --version 0.10.0
      - name: Checkout (stable)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.last_release.outputs.tag_name }}
          submodules: true
      - name: Stable
        run: |
          pip install conspire==${{ steps.last_release.outputs.tag_name }} matplotlib numpy
          cargo run --release
          bash book/prebuild.sh
          mdbook build
          mdbook test -L target/release/deps
          mkdir -p ../_site/stable/ && cp -r book/build/* ../_site/stable/
      - name: Checkout (latest)
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.5
      - name: Check
        run: ruff check
      - name: Format
        run: ruff format --check
      - name: Latest
        run: |
          pip install git+https://github.com/mrbuche/conspire.py.git matplotlib numpy
          cargo run --release
          bash book/prebuild.sh
          mdbook build
          mdbook test -L target/release/deps
          mkdir -p ../_site/latest/ && cp -r book/build/* ../_site/latest/
      - name: Site
        run: cp book/redirect.html ../_site/index.html
      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ../_site/
  Deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: Book
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
