name: Test
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}
env:
  CARGO_TERM_COLOR: always
on:
  pull_request:
    branches: main
permissions: {}
jobs:
  Checks:
    strategy:
      fail-fast: true
      matrix:
        features:
          - math
          - io
          - geometry
          - mechanics
          - physics
          - constitutive
          - fem
          - vem
          - cbm
          - all
        os: [macos-latest, windows-latest, ubuntu-latest]
        toolchain: [beta, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          components: clippy, rustfmt
          toolchain: ${{ matrix.toolchain }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release --features ${{ matrix.features }} -- -D warnings
      - name: Clippy tests
        run: cargo clippy --release --features ${{ matrix.features }} --tests -- -D warnings
      - name: Test
        run: cargo test --release --features ${{ matrix.features }}
  Coverage:
    strategy:
      fail-fast: true
      matrix:
        features:
          - math
          - io
          - geometry
          - mechanics
          - physics
          - constitutive
          # - fem
          # - vem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Install
        run: cargo install cargo-llvm-cov
      - name: Coverage
        if:  matrix.features == 'io'
        run: cargo llvm-cov test --profile release --features ${{ matrix.features }} --fail-under-functions 100 --fail-under-lines 100 --fail-under-regions 99
      - name: Coverage
        if:  matrix.features != 'io'
        run: cargo llvm-cov test --profile release --features ${{ matrix.features }} --fail-under-functions 50 --fail-under-lines 50 --fail-under-regions 50
      - name: Tree
        run: $([[ $(cargo tree --color always --edges normal --features ${{ matrix.features }} | wc -l) -eq 1 ]])
  Nightly:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          components: clippy
          toolchain: nightly
      - name: Test
        run: cargo test --release --features all,nightly
  Autodiff:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zautodiff=Enable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
      - name: Enzyme
        run: rustup component add enzyme
      - name: Test
        run: cargo test --release --features all,autodiff --lib autodiff
