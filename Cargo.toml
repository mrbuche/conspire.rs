[package]
authors = ["Michael R. Buche <mrbuche@sandia.gov>", "Chad B. Hovey <chovey@sandia.gov>"]
categories = ["mathematics", "science"]
description = "c o n s p i r e"
documentation = "https://docs.rs/crate/conspire"
edition = "2024"
exclude = ["/book/", "/book.toml", "/custom.css", "/custom.js"]
homepage = "https://mrbuche.github.io/conspire"
keywords = ["conspire", "mrbuche"]
license = "GPL-3.0"
name = "conspire"
repository = "https://github.com/mrbuche/conspire.rs"
version = "0.9.0"

[features]
all = ['cbm', 'vem']
autodiff = []
cbm = ['constitutive', 'geometry']
constitutive = ['mechanics']
doc = []
fem = ['constitutive', 'geometry']
geometry = ['io', 'math']
io = []
math = []
mechanics = ['math']
nightly = []
physics = ['mechanics']
vem = ['fem']

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--html-in-header", ".github/katex.html"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[profile.release-dev]
inherits = "release"
codegen-units = 32
lto = false

[[example]]
name = "book"
required-features = ["constitutive", "doc"]
